[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semicd"
version = "0.1.0"
description = "SemICD: Semantic IDs for generative ICD coding"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18",
  "PyYAML>=6",
  "scikit-learn>=1.6",
  "threadpoolctl>=3",
  "torch>=2.4",
  "transformers>=4.51",
]

[project.optional-dependencies]
train = ["torch>=2.4", "transformers>=4.51", "unsloth", "peft", "accelerate", "safetensors", "tokenizers"]

[project.scripts]
semicd = "semicd.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

